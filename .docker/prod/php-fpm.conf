; Installed as zz-app.conf: loaded after the image's docker.conf and www.conf,
; before zz-docker.conf (logging on stderr, `listen = 9000`). php-fpm runs as www-data
; (the image's USER), so the pool's user/group directives do not apply.
[www]
; Expose the container environment (APP_ENV, TRUSTED_PROXIES...) to PHP
clear_env = no

; ondemand: the only bound is pm.max_children, so any FPM_MAX_CHILDREN >= 1 is
; valid (dynamic's fixed spare counts would reject a value below them).
; Workers idle for a minute are stopped.
pm = ondemand
pm.max_children = ${FPM_MAX_CHILDREN}
pm.process_idle_timeout = 60s
pm.max_requests = 500

; Same hardening as php.ini, but not overridable by the application
php_admin_flag[session.upload_progress.enabled] = off
php_admin_value[post_max_size] = 32M
php_admin_value[upload_max_filesize] = 24M
php_admin_value[max_file_uploads] = 5
php_admin_value[max_input_nesting_level] = 16
